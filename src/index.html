<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .message {
        padding: 10px;
        background: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="lineprofile" style="display: none;">
      <img width="100px" id="profileImage" src="" />
      <div>
        Hello <b><span id="profileName">Name</span></b>
      </div>
      <div>UID <span id="profileUID">UID</span></div>
  
      <div class="message">
        <div>Send message</div>
        <input id="message" />
        <button onclick="sendMessage()">Send</button>
      </div>
      <button onclick="logOut()">Logout</button>
    </div>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.1/axios.min.js"

    ></script>
    <script>
      let userId = "";
  
      const main = async () => {
        await liff.init({ liffId: "2011793410-tFVvjATb" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
  
          // update profile
          profileImage.src = profile.pictureUrl;
          profileName.innerText = profile.displayName;
          profileUID.innerText = profile.userId;
  
          // collect userId
          userId = profile.userId;
  
          // show profile
          lineprofile.style.display = "block";
        } else {
          liff.login();
        }
      };
  
      const logOut = () => {
        liff.logout();
        window.location.reload();
      };

      const sendMessage = async () => {
        try {
          if (!message.value) {
            alert("message not found");
            return false;
          }
  
          const data = {
            userId,
            message: message.value,
          };
          console.log("data", data);
          const response = await axios.post("https://da2a-27-130-85-82.ngrok-free.app", data);
          console.log("response", response.data);
        } catch (error) {
          const msg = error.response?.data?.error ?? error.message;
          console.log("error", msg, error.response?.data);
          alert(msg);
        }
      };
      main();
    </script>
  </body>
</html>
